# Hạ tầng phát triển cục bộ.
#
# Ứng dụng chạy được mà không cần dịch vụ nào (chế độ bộ nhớ), nhưng mỗi dịch vụ
# bật thêm một khả năng:
#
#   postgres  DATABASE_URL  dữ liệu bền (tiền, chuyến, nhật ký)
#   redis     REDIS_URL     nhiều bản sao (vị trí, khoá chuyến, báo giá, rate limit)
#   nats      NATS_URL      ack cho consumer — giết pod giữa chừng không mất việc
#   emqx      MQTT_URL      luồng vị trí tiết kiệm pin + Last Will
#   osrm      OSRM_URL      quãng đường thật thay cho ước lượng đường chim bay
#
# Bật hết:
#   docker compose -f deploy/docker-compose.yml up -d postgres redis nats emqx
services:
  postgres:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: godrive
      POSTGRES_PASSWORD: godrive
      POSTGRES_DB: godrive
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U godrive"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["6379:6379"]

  nats:
    image: nats:2.10-alpine
    # -js bật JetStream (bền + ack), -m mở cổng giám sát để xem consumer tồn đọng:
    #   curl -s localhost:8222/jsz?consumers=1\&streams=1
    command: ["-js", "-m", "8222"]
    ports: ["4222:4222", "8222:8222"]
    volumes: ["natsdata:/data"]

  emqx:
    image: emqx/emqx:5.6
    # MQTT cho luồng vị trí tài xế: tiết kiệm pin và băng thông hơn WebSocket
    ports: ["1883:1883", "18083:18083"]

  osrm:
    # Chuẩn bị dữ liệu trước:
    #   wget http://download.geofabrik.de/asia/vietnam-latest.osm.pbf
    #   docker run -t -v "$PWD/osrm:/data" osrm/osrm-backend \
    #     osrm-extract -p /opt/motorcycle.lua /data/vietnam-latest.osm.pbf
    image: osrm/osrm-backend:latest
    command: ["osrm-routed", "--algorithm", "mld", "/data/vietnam-latest.osrm"]
    volumes: ["./osrm:/data"]
    ports: ["5000:5000"]
    profiles: ["routing"]

volumes:
  pgdata:
  natsdata:
