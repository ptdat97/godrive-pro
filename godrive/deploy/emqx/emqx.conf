## Cấu hình EMQX cho GoDrive — BẢO MẬT LÀ MÃ NGUỒN, KHÔNG PHẢI THAO TÁC TAY.
##
## Tệp này tồn tại vì một lý do cụ thể: broker mặc định của EMQX cho phép mọi
## kết nối nặc danh, và luật phân quyền mặc định kết thúc bằng {allow, all}.
## Cấu hình lại bằng REST API hay bằng bảng điều khiển thì chỉ container đó có;
## dựng lại container là quay về mặc định mở toang mà không có gì báo.
##
## Xem docs/08 §8.12 và internal/mqttauth.

node {
  name = "emqx@127.0.0.1"
  cookie = "emqxsecretcookie"
  data_dir = "data"
}

cluster {
  name = emqxcl
  discovery_strategy = manual
}

dashboard {
  listeners.http { bind = 18083 }
}

listeners.tcp.default {
  bind = "0.0.0.0:1883"
  max_connections = 1024000
}

## ------------------------------------------------------------------ XÁC THỰC
##
## Broker không tự giữ danh sách người dùng. Nó hỏi ngược lại backend, nơi danh
## tính tài xế, trạng thái khoá tài khoản và việc thu hồi phiên đã sống sẵn.
## Nhân bản những thứ đó sang broker là tạo ra bản sao thứ hai chắc chắn sẽ
## lệch — tài xế bị khoá lúc 9 giờ mà 10 giờ vẫn đẩy được vị trí.
authentication = [
  {
    mechanism = password_based
    backend = http
    method = post
    url = "http://host.docker.internal:8080/internal/mqtt/auth"
    headers { "content-type" = "application/json" }
    body {
      clientid = "${clientid}"
      username = "${username}"
      password = "${password}"
    }
    pool_size = 8
    connect_timeout = 5s
    request_timeout = 5s
  }
]

## -------------------------------------------------------------- PHÂN QUYỀN
authorization {
  ## no_match = deny là dòng quan trọng nhất trong cả tệp.
  ##
  ## Mặc định của EMQX là "allow": thao tác nào không khớp luật nào thì ĐƯỢC
  ## PHÉP. Nghĩa là quên một luật không gây lỗi, nó chỉ lặng lẽ mở một cánh cửa.
  no_match = deny

  ## Vi phạm thì NGẮT kết nối, không im lặng bỏ gói.
  ##
  ## "ignore" khiến thiết bị tưởng đã gửi thành công trong khi bản tin rơi vào
  ## hư không — lỗi kiểu đó có thể sống hàng tháng. Ngắt kết nối làm nó lộ ra
  ## ngay ở lần thử đầu tiên.
  ##
  ## Lưu ý khi viết test: một vi phạm là mất phiên, nên mỗi phép thử cần một kết
  ## nối riêng.
  deny_action = disconnect

  cache { enable = true, max_size = 32, ttl = 1m }

  ## KHÔNG có nguồn "file" ở đây. Bộ luật mặc định của EMQX kết thúc bằng
  ## {allow, all} và cả một dòng mở toang cho 127.0.0.1 — nghĩa là bất kỳ tiến
  ## trình nào chạy cùng máy với broker cũng làm được mọi thứ.
  sources = [
    {
      type = http
      method = post
      url = "http://host.docker.internal:8080/internal/mqtt/authz"
      headers { "content-type" = "application/json" }
      body {
        clientid = "${clientid}"
        username = "${username}"
        topic = "${topic}"
        action = "${action}"
      }
      pool_size = 8
      connect_timeout = 5s
      request_timeout = 5s
    }
  ]
}
